<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>びゅーんパーク</title>
<meta name="theme-color" content="#aee7ff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    height: 100dvh;
    background: #aee7ff;
    font-family: system-ui, sans-serif;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4vh;
    background: linear-gradient(180deg, rgba(120,200,255,.55), rgba(255,235,170,.55));
    z-index: 10;
  }
  .overlay.hidden { display: none; }

  .logo { font-size: 22vw; line-height: 1; filter: drop-shadow(0 4px 6px rgba(0,0,0,.2)); }

  .bigbtn {
    border: none;
    background: #fff;
    border-radius: 50%;
    width: 38vw;
    height: 38vw;
    max-width: 220px;
    max-height: 220px;
    font-size: 16vw;
    box-shadow: 0 8px 20px rgba(0,0,0,.25);
    animation: pulse 1.2s ease-in-out infinite;
    cursor: pointer;
  }
  .btnrow { display: flex; gap: 7vw; align-items: center; }
  .bigbtn.sub {
    width: 24vw;
    height: 24vw;
    max-width: 140px;
    max-height: 140px;
    font-size: 10vw;
    animation-delay: .6s;
  }
  @media (min-width: 600px) { .bigbtn { font-size: 90px; } .bigbtn.sub { font-size: 56px; } .logo { font-size: 120px; } }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  #hud {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: 12px;
    font-size: 8vw;
    max-font-size: 40px;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,.35);
    z-index: 5;
    pointer-events: none;
  }
  @media (min-width: 600px) { #hud { font-size: 40px; } }
  #hud.hidden { display: none; }

  #goalStars { font-size: 12vw; letter-spacing: .05em; text-align: center; max-width: 90vw; word-break: break-all; line-height: 1.3; }
  @media (min-width: 600px) { #goalStars { font-size: 60px; } }

  #totalStars {
    background: rgba(255,255,255,.85);
    border-radius: 999px;
    padding: 1.5vw 5vw;
    font-size: 7vw;
    box-shadow: 0 3px 10px rgba(0,0,0,.15);
  }
  @media (min-width: 600px) { #totalStars { font-size: 36px; padding: 8px 28px; } }

  #confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  #confetti span {
    position: absolute;
    top: -12vh;
    font-size: 7vw;
    animation: fall linear forwards;
  }
  @media (min-width: 600px) { #confetti span { font-size: 40px; } }
  @keyframes fall {
    to { transform: translateY(120vh) rotate(360deg); }
  }
</style>
</head>
<body>
  <div id="hud" class="hidden">⭐0</div>

  <div id="title" class="overlay">
    <div class="logo">🎡</div>
    <div class="btnrow">
      <button id="coasterBtn" class="bigbtn">🎢</button>
      <button id="slideBtn" class="bigbtn">🛝</button>
    </div>
    <div id="totalStars">⭐0</div>
  </div>

  <div id="goal" class="overlay hidden">
    <div id="confetti"></div>
    <div id="goalLogo" class="logo">🎉</div>
    <div id="goalStars"></div>
    <div class="btnrow">
      <button id="againBtn" class="bigbtn">🔁</button>
      <button id="homeBtn" class="bigbtn sub">🏠</button>
    </div>
  </div>

  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
